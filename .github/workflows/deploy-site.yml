name: Deploy site

# Builds the browser/mobile build of View Finder (src/site/ - the same
# renderer UI and core/ pipeline the desktop app uses, running directly in
# the page instead of over Electron's IPC - see src/site/webApi.ts) and
# publishes it to GitHub Pages. Free hosting, no server to run or pay for,
# consistent with the rest of this app's $0-cost data stack.

on:
  push:
    branches: [main]
    paths:
      - 'src/site/**'
      - 'src/renderer/**'
      - 'src/core/**'
      - 'src/shared/**'
      - 'build/**'
      - 'vite.site.config.ts'
      - 'tsconfig.site.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push should win rather than
# queue behind an older one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
