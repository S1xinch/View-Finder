appId: com.viewfinder.app
productName: View Finder
# electron-builder auto-detects CI and otherwise tries to publish straight
# to GitHub itself (needs its own GH_TOKEN), separate from and redundant
# with release.yml's own upload-artifact + softprops/action-gh-release
# steps that already handle attaching the installers to a Release. Without
# this, a CI build fails outright ("GitHub Personal Access Token is not
# set") even though the actual installer built successfully.
publish: never
directories:
  buildResources: build
  output: release
# A single 1024x1024 source PNG - electron-builder generates the
# platform-specific .ico (Windows) and .icns (macOS) from it automatically
# during the build. See build/icon-source.svg for the editable source.
icon: build/icon.png
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target: nsis
  # No code-signing cert configured on purpose — keeps this free to build.
  # SmartScreen may warn on first run; that's acceptable for now.
mac:
  target: dmg
  category: public.app-category.travel
  # Unsigned/un-notarized on purpose (no Apple Developer Program) — Gatekeeper
  # will warn on first launch; right-click -> Open bypasses it.
  identity: null
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
