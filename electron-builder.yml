appId: com.viewfinder.app
productName: View Finder
# NOT `publish: never` (that string gets resolved as a *provider name*,
# i.e. it looks for a package called "electron-publisher-never" and
# crashes since no such package exists) and NOT omitting this key entirely
# (electron-builder then auto-infers a GitHub publish target from the
# repo's remote and tries to actually publish, needing its own GH_TOKEN -
# this is what caused the first CI failure). Config with an explicit null
# is electron-builder's own documented escape hatch (see
# app-builder-lib's getPublishConfigs: "if explicitly set to null - do not
# publish") - it skips all publish-target resolution entirely, leaving
# release.yml's own upload-artifact + softprops/action-gh-release steps as
# the only thing that actually publishes anything.
publish: null
directories:
  buildResources: build
  output: release
# A single 1024x1024 source PNG - electron-builder generates the
# platform-specific .ico (Windows) and .icns (macOS) from it automatically
# during the build. See build/icon-source.svg for the editable source.
icon: build/icon.png
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target: nsis
  # No code-signing cert configured on purpose — keeps this free to build.
  # SmartScreen may warn on first run; that's acceptable for now.
mac:
  target: dmg
  category: public.app-category.travel
  # Unsigned/un-notarized on purpose (no Apple Developer Program) — Gatekeeper
  # will warn on first launch; right-click -> Open bypasses it.
  identity: null
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
